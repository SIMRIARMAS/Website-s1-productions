<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d22"/><stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ccd2"/><stop offset=".45" stop-color="#8e929a"/><stop offset="1" stop-color="#5d6068"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7d9de"/><stop offset="1" stop-color="#9a9ea6"/>
    </linearGradient>
    <radialGradient id="glass" cx=".38" cy=".34" r=".75">
      <stop offset="0" stop-color="#4f8dff"/><stop offset=".35" stop-color="#16306b"/><stop offset=".75" stop-color="#05070d"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3d44"/><stop offset=".5" stop-color="#16171b"/><stop offset="1" stop-color="#2c2e34"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- top plate: viewfinder hump + shutter -->
  <path d="M176 150h96l18-30h-132z" fill="url(#top)"/>
  <rect x="318" y="128" width="46" height="22" rx="8" fill="url(#top)"/>
  <!-- body -->
  <rect x="88" y="150" width="336" height="232" rx="44" fill="url(#body)"/>
  <rect x="88" y="150" width="336" height="232" rx="44" fill="none" stroke="#e6e8ec" stroke-opacity=".35" stroke-width="3"/>
  <!-- textured grip band -->
  <rect x="88" y="214" width="336" height="104" fill="#2a2c31" opacity=".9"/>
  <!-- lens -->
  <circle cx="256" cy="266" r="92" fill="url(#ring)" stroke="#b9bcc3" stroke-width="6"/>
  <circle cx="256" cy="266" r="66" fill="url(#glass)"/>
  <circle cx="256" cy="266" r="66" fill="none" stroke="#3d8bff" stroke-opacity=".55" stroke-width="3"/>
  <ellipse cx="232" cy="240" rx="20" ry="13" fill="#fff" opacity=".55" transform="rotate(-30 232 240)"/>
  <circle cx="286" cy="292" r="6" fill="#fff" opacity=".25"/>
  <!-- flash + red dot -->
  <rect x="118" y="172" width="44" height="24" rx="7" fill="#eef0f3" opacity=".9"/>
  <circle cx="386" cy="186" r="9" fill="#ff3b4e"/>
</svg>
